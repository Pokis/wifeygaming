<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <rect width="64" height="64" rx="16" fill="#0f172a"/>
  
  <!-- Gamepad Body -->
  <path d="M16 26 C16 20, 24 18, 32 18 C40 18, 48 20, 48 26 C50 36, 52 46, 44 48 C39 49, 36 43, 32 43 C28 43, 25 49, 20 48 C12 46, 14 36, 16 26 Z" fill="url(#glowGrad)" filter="url(#glow)"/>
  
  <!-- D-pad & Buttons -->
  <circle cx="24" cy="30" r="2.5" fill="#ffffff"/>
  <circle cx="40" cy="27" r="2" fill="#ffffff"/>
  <circle cx="44" cy="31" r="2" fill="#ffffff"/>
  
  <!-- Heart Icon Center -->
  <path d="M32 34 C30 31, 27 32, 27 34 C27 36, 32 39, 32 39 C32 39, 37 36, 37 34 C37 32, 34 31, 32 34 Z" fill="#ffffff"/>
</svg>
